# EC2 deployment. Nginx on the host terminates TLS and proxies to 127.0.0.1:8000.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"  # Only bind to localhost — Nginx proxies externally
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
  media_data:

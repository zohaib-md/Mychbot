# /etc/nginx/sites-available/instant_mechanic
# Host-level Nginx in front of the Dockerised Django/Gunicorn API.
# After `certbot --nginx -d <EC2-IP>.nip.io`, certbot adds the 443 block and
# an HTTP -> HTTPS redirect to this file automatically.
server {
    listen 80;
    server_name _;  # Replace with <EC2-IP>.nip.io after provisioning

    client_max_body_size 25M;   # Accommodate 20 MB media uploads with headroom

    # API, OpenAPI schema and Swagger UI (/api/docs/)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # Buffer for Gemini free-tier latency
        proxy_connect_timeout 10s;
    }

    # Liveness probe
    location = /health/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media is intentionally NOT exposed publicly: files are only
    # read server-side and forwarded to Gemini during diagnosis.
    location / {
        return 404;
    }
}
